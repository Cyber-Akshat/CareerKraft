<!-- Copy this body into your EmailJS template's HTML/code editor.
     Configure the recipient, subject and sender using ../EMAILJS-SETUP.md. -->
<div style="margin: 0; padding: 24px; background-color: #f4f6fb; font-family: Arial, Helvetica, sans-serif; color: #172038;">
  <div style="max-width: 560px; margin: 0 auto; padding: 28px; background-color: #ffffff; border-radius: 12px;">
    <p style="margin: 0 0 20px; font-size: 22px; font-weight: 700;">CareerKraft</p>
    <div style="font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;">{{message}}</div>
    {{#action_url}}
    <p style="margin: 24px 0;">
      <a href="{{action_url}}" style="display: inline-block; padding: 14px 24px; border-radius: 6px; background-color: #ff0044; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none;">Continue</a>
    </p>
    {{/action_url}}
    <p style="margin: 24px 0 0; font-size: 12px; line-height: 1.5; color: #5b6479;">If the link does not open when you click it, copy the complete address into your browser.</p>
  </div>
</div>
