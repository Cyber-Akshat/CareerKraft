<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/accessibility.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set a new password for your CareerKraft account using your secure reset link.">
  <title>Reset your password | CareerKraft</title>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("careerkraft-theme") === "dark" ? "dark" : "light";
    } catch { document.documentElement.dataset.theme = "light"; }
  </script>
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/site.css">
  <script src="/site.js" defer></script>
</head>
<body class="verification-body">
  <main class="verify-layout">
    <section class="verify-content">
      <a class="verify-brand" href="index.html">CareerKraft</a>
      <div class="verify-status">
        <h1>Reset your password</h1>
        <p class="verify-description">Use 15–128 characters. Choose a unique passphrase and avoid common or repeated passwords.</p>
        <form id="reset-form">
          <label for="new-password">New password</label>
          <input id="new-password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required>
          <label for="repeat-password">Confirm password</label>
          <input id="repeat-password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required>
          <button class="verify-primary-button" type="submit">Save password</button>
        </form>
        <p id="reset-message" class="verify-message" role="status" aria-live="polite"></p>
        <a class="verify-secondary-button" href="auth.html">Back to sign in</a>
      </div>
    </section>
  </main>
  <script src="auth-api.js"></script>
  <script src="reset-password.js"></script>

  <footer class="site-footer"><p>&copy; <span data-current-year>2026</span> CareerKraft</p><nav aria-label="Footer navigation"><a href="/index.html">Home</a><a href="/terms.html">Terms</a><a href="/privacy.html">Privacy</a><a href="/terms.html#contact">Contact</a></nav></footer>

</body>
</html>
